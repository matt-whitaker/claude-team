          # author's `structured_output` is never available to this step — it would always
          # render an empty fenced block and contradict the prompt, which sends the Tester to
          # the Handoff comments on the story's ISSUE instead.
          prompt: ${{ steps.p_tester.outputs.body }}
          claude_args: |
            --model sonnet
            --allowedTools "Edit,Write,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*)"
            --max-turns 80

      # ── Writer ──
      # The tech writer. Owns documentation: every CLAUDE.md, the agent instruction files
      # under .claude/skills, and anything else whose job is to explain rather than run.
      #
      # ⚠️ Split out because CLAUDE.md was the single biggest source of merge conflicts —
      # every role edited it, so two branches touching the same package collided on prose
      # neither was really working on. Implementor and Tester report what needs documenting
      # and change no docs themselves.
      - name: Stamp the Writer label
        if: contains(steps.roles.outputs.list, 'writer')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: writer
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: MODE=stamp "$RUNNER_TEMP/agent-bin/labels-and-status.py"
      - name: Writer
        id: writer
        if: contains(steps.roles.outputs.list, 'writer')
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORY: ${{ needs.delegate.outputs.story }}
          # the issue that actually triggered this run — the role's brief. Empty on a PR
          # trigger, where $STORY is the one to read.
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        with:
          # ⚠️ THE HOST ACTION HAS ITS OWN ACTOR GUARD, INDEPENDENT OF OURS, and it rejected every
          # cascaded run: "Workflow initiated by non-human actor: brewdocs-claude (type: Bot)".
          # Our delegate guard admits this App on purpose — that is how a story cascades — but
          # admitting it there only gets the job started; the action then refuses at setup, before
          # the model is called. Measured on run 31929531465 (#1094).
          # ⚠️ NAMED, NEVER `*`. The action's own warning is that `*` lets any external App invoke
          # it with a prompt it controls. One private App with issues:write is the whole grant.
          allowed_bots: brewdocs-claude
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ⚠️ THE EXACT HANDLE, and this is load-bearing. trigger_phrase does NOT gate
          # anything for us — checkContainsTrigger() returns early on `if (prompt) return
          # true` and we always pass a prompt. Its ONLY effect is that the action extracts
          # everything AFTER this phrase as "the user request" and yields it as the final
          # content block, which the CLI scans for a SLASH COMMAND. Set to a bare "@claude",
          # the comment "@claude/writer do X" extracts as "/writer do X" — dispatched as an
          # unknown slash command, so the run returns success in ~150ms having never called
          # the model. Every comment-triggered role was dead this way between #485 and #488.
          trigger_phrase: "@claude/writer"
          # ⚠️ THE ACTION MAKES ITS OWN BRANCH AND TELLS THE MODEL TO STAY ON IT (#530). For an
          # issue trigger it always creates one — there is no way to decline in tag mode — and
          # then injects "You are already on the correct branch. Do not create a new branch",
          # which contradicts our prompt. Which instruction wins is down to the model, and it
          # has gone both ways: #497 pushed to the story branch, #514 pushed 44 turns of work
          # to `claude/issue-514-…` where nothing looks, reporting success.
          #
          # Empty prefix + this template makes that branch `<issue#>-<kebab-title>` — our own
          # shape. For a task that fully resolves it, since an author cuts any `<task#>-…`
          # branch it likes. It cannot match a story branch the Architect already named, so
          # finish-pr.py also reports commits stranded on an unexpected branch.
          # a task branch is cut off its STORY branch, not the default one — see the job
          # header. Empty when no story resolves, which falls back to the default branch.
          base_branch: ${{ needs.delegate.outputs.story_branch }}
          branch_prefix: ""
          branch_name_template: "{{entityNumber}}-{{description}}"
          track_progress: true
          # ⚠️ NO handoff appended — same reason as the Tester. The Writer reads the Handoff
          # comments on its own story's ISSUE, on its own trigger.
          prompt: ${{ steps.p_writer.outputs.body }}
          # ⚠️ `npm`/`npx` because a SPECIFICATION IS WRITTEN BY DRIVING THE APP. The Writer states
          # what a brewer can do and see, which means starting the dev server and driving Chrome —
          # `npm run dev -w packages/app`, then Playwright via `npx`. Without them the role is told
          # to do something it cannot, and burns its budget on permission denials discovering that.
          # ⚠️ This is the same grant the Tester has, for the same reason: both drive the app.
          # ⚠️ It breaks no principle. The role that must hold NO shell is the Researcher, because
          # its input is arbitrary web content and an injection there has an author. The Writer's
          # input is maintainer-shaped issues — the trust level of every other authoring role.
          claude_args: |
            --model sonnet
            --allowedTools "Read,Edit,Write,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*)"
            --max-turns 80

      # ── Once, for the job ──
      # ⚠️ BEFORE finish-pr.py, and the order is load-bearing: the story's PR must not be opened
      # until the commits it would describe are actually on the branch, or `open-story-pr.py`
      # finds 0-ahead and correctly declines — leaving the story with no PR until something else
      # happens to trigger it.
      # ⚠️ A TASK HAS NO PR. The branch the action minted is a staging area; this commits the
      # run's changes (message from the author's structured output), lands them on the story
      # branch, and closes the task. A refused push reconciles by MERGE — pull latest, commit the
      # merge commit, push — because two tasks of one story can run concurrently (the concurrency
      # group is keyed on the issue and cannot be keyed on the story, since it is evaluated before
      # the story is resolved). A merge that CONFLICTS fails the step with `unlandable=true`, the
      # signal the failure-capture step keys on: a script must not pick a side, and the commits
      # stay safe on the run's branch.
      # ⚠️ GATED OFF WHEN A MODEL STEP FAILED — landing half-done work is worse than landing
      # nothing. The failed run's changes are not lost: the capture step below is the other exit,
      # and between them every author run ends in a scripted landing or a scripted failure
      # capture. There is no third exit.
      - name: Complete the work
        id: completion
        if: always() && steps.roles.outputs.list != '' && steps.implementor.outcome != 'failure' && steps.designer.outcome != 'failure' && steps.tester.outcome != 'failure' && steps.writer.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          # `remaining` decides whether the task closes — the author's only structured way to say
          # it did not finish. `commitMessage` names the commit the hook makes.
          HANDOFF: ${{ steps.implementor.outputs.structured_output || steps.designer.outputs.structured_output }}
        run: "$RUNNER_TEMP/agent-bin/work-completion.py"

      # ⚠️ THE OTHER EXIT. A failed model step or a conflicted landing pushes the run's changes to
      # `failure/<task#>-<run#>` and reports on the issue — recovery becomes checkout, not
      # transcript archaeology. It never fails and never masks: the run is already red for the
      # real reason.
      - name: Capture the failure
        if: always() && steps.roles.outputs.list != '' && (steps.implementor.outcome == 'failure' || steps.designer.outcome == 'failure' || steps.tester.outcome == 'failure' || steps.writer.outcome == 'failure' || steps.completion.outputs.unlandable == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          MODEL_FAILED: ${{ (steps.implementor.outcome == 'failure' || steps.designer.outcome == 'failure' || steps.tester.outcome == 'failure' || steps.writer.outcome == 'failure') && 'true' || 'false' }}
          UNLANDABLE: ${{ steps.completion.outputs.unlandable || 'false' }}
        run: "$RUNNER_TEMP/agent-bin/capture-failure.py"

      # ⚠️ A TASK REACHES DONE HERE OR NOWHERE. `close-merged-work.py` sets Done from a merged PR,
      # and a task has none — so before this, every task closed while sitting in In Progress
      # forever. The story still reaches Done its own way, through its PR.
      # ⚠️ Gated on `closed`, not on the step succeeding: a task that reported work `remaining` is
      # deliberately left open, and marching it to Done would erase the one signal saying it is
      # unfinished.
      # ⚠️ PROJECTS_TOKEN is safe here for the usual reason and only that reason — step env is
      # per-step, so the model steps above cannot read it.
      - name: Move the task to Done
        if: always() && steps.completion.outputs.closed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          PROJECT_OWNER: "@me"
          PROJECT_NUMBER: "4"
          STATUS: "Done"
        run: MODE=status "$RUNNER_TEMP/agent-bin/labels-and-status.py"

      # ⚠️ PHASE 2: after a task lands and closes, start the next one. The token is minted from
      # the brewdocs-claude App — issues:write on this repo and nothing else, valid one hour —
      # because events created with the workflow's own token start no runs, by design. The
      # dispatch is a label add: the same @claude button the maintainer presses, so no new entry
      # path exists. ⚠️ `continue-on-error` + the token-empty gate below keep the cascade DARK
      # when the secrets are absent — the maintainer's manual gesture still works unchanged.
      - name: Mint the dispatch token
        id: dispatch-token
        if: always() && steps.completion.outputs.closed == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
      # ⚠️ Gated on the landing having CLOSED the task: a failed run, an unlandable merge, or
      # work remaining all leave `closed` false, and the cascade halts right there — the failure
      # capture and report have already told the maintainer where to look. No retry loops: the
      # @claude label is the in-flight marker, and re-adding a present label fires nothing.
      - name: Dispatch the next task
        if: always() && steps.completion.outputs.closed == 'true'
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          REPO: ${{ github.repository }}
          STORY: ${{ needs.delegate.outputs.story }}
          HAVE_SECRETS: ${{ secrets.DISPATCH_APP_ID != '' && secrets.DISPATCH_APP_PRIVATE_KEY != '' }}
        run: "$RUNNER_TEMP/agent-bin/dispatch-next.py"

      # ⚠️ The primary call site. After each landing the hook checks whether that was the LAST
      # task — every earlier landing just reports how many remain. The merge-path call is the net.
      # Its own already-exists and 0-ahead guards keep re-runs idempotent.
      # ⚠️ `landed_ref` first: an as-is story has NO `story_branch` output (the delegator blanks
      # it so the run cuts from the default branch), so the ref the completion hook just landed on
      # is the only name for it. A task run emits the same ref as `story_branch` carries anyway.
      - name: Open the story's PR when the last task lands
        if: always() && steps.roles.outputs.list != '' && (steps.completion.outputs.landed_ref || needs.delegate.outputs.story_branch) != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.completion.outputs.landed_ref || needs.delegate.outputs.story_branch }}
        run: "$RUNNER_TEMP/agent-bin/open-story-pr.py"

      - name: Label and link the PR
        if: always() && steps.roles.outputs.list != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # every role that ran, so the PR carries the whole trail rather than whichever
          # one happened to be last
          ROLES: ${{ steps.roles.outputs.list }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          # ⚠️ The same author output post-handoff.py gets, and the reason this step can tell a
          # finished task from a half-done one. Without it the hook only ever asked whether the
          # closing keyword was present, never why it was absent — so an author that deliberately
          # left it off had that decision overwritten, and #617 closed as completed with its
          # wiring never written.
          HANDOFF: ${{ steps.implementor.outputs.structured_output || steps.designer.outputs.structured_output }}
        run: "$RUNNER_TEMP/agent-bin/finish-pr.py"
      - name: Persist the author's handoff
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          # ⚠️ The PR half of the same trigger, and it is load-bearing. ISSUE is deliberately
          # blank on a PR, and the hook used to return on that alone — so a follow-up run, which
          # is where review feedback arrives, produced a schema-forced handoff and discarded it.
          # STORY is resolved for a PR too (delegate.py rule 2, off the head branch), so with
          # this the handoff and its `decisions` reach the story either way.
          PR: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          # where it is posted: the story's ISSUE, which always exists. The story's PR does
          # not, until the first task PR merges into its branch.
          STORY: ${{ needs.delegate.outputs.story }}
          ROLES: ${{ steps.roles.outputs.list }}
          # whichever author ran — they are alternatives and emit the same schema, so `||`
          # takes the one that produced output. Empty when neither ran or the step failed,
          # which the hook treats as "nothing to post" rather than an error.
          HANDOFF: ${{ steps.implementor.outputs.structured_output || steps.designer.outputs.structured_output }}
        run: "$RUNNER_TEMP/agent-bin/post-handoff.py"
      - name: Update the story's task order
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STORY: ${{ needs.delegate.outputs.story }}
        run: "$RUNNER_TEMP/agent-bin/log-to-story.py"
      - name: Update the epic's work log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
          ROLES: ${{ steps.roles.outputs.list }}
        run: "$RUNNER_TEMP/agent-bin/log-to-epic.py"

      # ⚠️ Diagnostics only, and it must never redden a good run — hence continue-on-error, and
      # `always()` so a FAILED run still yields its transcript, which is when you most want one.
      # ⚠️ Turned on and off at runtime by the AGENT_TRANSCRIPTS repository variable; unset means
      # off, so this is inert until someone opts in. See .github/actions/capture-transcript.
      - name: Capture the transcript
        if: always()
        continue-on-error: true
        uses: ./.github/actions/capture-transcript
        with:
          enabled: ${{ contains(vars.AGENT_TRANSCRIPTS, 'all') || contains(vars.AGENT_TRANSCRIPTS, 'authors') }}
          role: ${{ needs.delegate.outputs.roles }}
          execution_file: ${{ steps.implementor.outputs.execution_file || steps.designer.outputs.execution_file || steps.tester.outputs.execution_file || steps.writer.outputs.execution_file }}
          role_arn: ${{ secrets.AWS_TRANSCRIPTS_ROLE }}
          bucket: ${{ secrets.AWS_TRANSCRIPTS_BUCKET }}
          entity: ${{ github.event.issue.number || github.event.pull_request.number }}

  # ── Security ───────────────────────────────────────────────────────────────────
  # Reviews what just landed on mainline and files issues for what it finds. Runs on
  # merge rather than on the PR, deliberately: a review that blocks a merge gets
  # argued with, a review that files an issue gets triaged.
  #
  # ⚠️ It opens issues and nothing else — no code, no PRs, no merges.
  #
  # ⚠️ TWO WAYS IN, AND THE MERGE PATH MUST NOT REGRESS. `delegate` skips on `pull_request`
  # events — it has no arm for them — so without `always()` a job that `needs:` it would
  # skip on every merge, silently removing the automatic review.
  security:
    needs: delegate
    if: |
      always() && (
        (github.event_name == 'pull_request'
          && github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == 'mainline')
        || (needs.delegate.result != 'skipped' && (
             contains(needs.delegate.outputs.roles, 'security')
             || contains(github.event.comment.body, '@claude/security')
             || contains(github.event.review.body, '@claude/security')
           ))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ⚠️ write, not read: the on-demand path's whole contract is that a requested review
      # always answers, and that answer is `gh pr comment`. GitHub scopes a comment on a PR
      # under `pull-requests`, not `issues`, so read would fail at the final step and
      # produce exactly the silence the contract exists to prevent.
      #
      # ⚠️ It covers the merge path too, which does not need it — `permissions:` is
      # job-level and GitHub does not evaluate expressions there, so it cannot be granted
      # per trigger. Splitting Security into two jobs would buy that granularity at the cost
      # of duplicating the job; after #492 narrowed the allowlist to specific `gh`
      # subcommands, what this permission still enables is "post a comment", which is the
      # feature. Revisit if that allowlist ever widens again.
      #
      # Still no `contents: write` — this role reads code and files issues, it never pushes.
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prompt
        uses: ./.github/actions/load-prompt
        with:
          role: security
      - id: security
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the one value a prompt file can't carry: `${{ }}` is evaluated by Actions in
          # the workflow, never inside a file. Passed as env so security.md stays static
          # and the model's own shell expands it.
          # ⚠️ Both paths. `pull_request.number` is empty for a comment ON a PR, where the
          # number lives at `issue.number` — without the fallback an on-demand review would
          # run `gh pr diff ""` and review nothing.
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          # merge = automatic, request = someone asked. security.md stays silent on a clean
          # merge review and always answers a requested one.
          TRIGGER: ${{ github.event_name == 'pull_request' && 'merge' || 'request' }}
        with:
          # ⚠️ THE HOST ACTION HAS ITS OWN ACTOR GUARD, INDEPENDENT OF OURS, and it rejected every
          # cascaded run: "Workflow initiated by non-human actor: brewdocs-claude (type: Bot)".
          # Our delegate guard admits this App on purpose — that is how a story cascades — but
          # admitting it there only gets the job started; the action then refuses at setup, before
          # the model is called. Measured on run 31929531465 (#1094).
          # ⚠️ NAMED, NEVER `*`. The action's own warning is that `*` lets any external App invoke
          # it with a prompt it controls. One private App with issues:write is the whole grant.
          allowed_bots: brewdocs-claude
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ⚠️ The exact handle, for the reason in #488: with no value this defaults to
          # "@claude", and "@claude/security review this" would extract as
          # "/security review this" — swallowed as an unknown slash command, so the run
          # returns success having never called the model.
          trigger_phrase: "@claude/security"
          prompt: ${{ steps.prompt.outputs.body }}
          # ⚠️ SUBCOMMANDS, NOT FAMILIES — the one role where this matters (#492). It reads
          # unmerged, unreviewed diffs, so its input is written by whoever authored the
          # change it is judging. `Bash(gh:*)` plus `pull-requests: write` would have let a
          # successful prompt injection run `gh pr review --approve` or `gh pr edit` on the
          # very PR the maintainer asked it to distrust.
          #
          # ⚠️ EVERY ENTRY HAS NO MUTATING FORM. That is the rule this list is built on, and
          # why `git branch` and `git remote` are absent despite being useful for
          # orientation. Deliberately denied, and the whole point of #492: `gh pr review`,
          # `gh pr edit`, `gh pr merge`, `gh pr close`, `gh issue close`, `gh issue edit`,
          # and `gh api` — which reaches every endpoint the token has and would undo the
          # rest of this list on its own.
          #
          # ⚠️ TOO NARROW STARVES IT, and that failure is invisible (#494). Cut to only the
          # playbook's own commands, the first run spent 5 of 6 turns denied and reported
          # nothing — and on the merge path a clean review is silent, so "found nothing" and
          # "could do nothing" look identical from outside. The read-only orientation
          # commands a review opens with are as load-bearing as the ones that do the work.
          # ⚠️ It cannot go lower than the action's base set: `Bash(git add|commit|rm:*)`
          # and `git-push.sh` union in and cannot be removed. `contents: read` is what
          # actually stops a push, not the allowlist.
          claude_args: |
            --model sonnet
            --allowedTools "Read,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh repo view:*),Bash(gh project item-add:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(git blame:*),Bash(npm audit:*)"
            --max-turns 40

      # ⚠️ Diagnostics only, and it must never redden a good run — hence continue-on-error, and
      # `always()` so a FAILED run still yields its transcript, which is when you most want one.
      # ⚠️ Turned on and off at runtime by the AGENT_TRANSCRIPTS repository variable; unset means
      # off, so this is inert until someone opts in. See .github/actions/capture-transcript.
      - name: Capture the transcript
        if: always()
        continue-on-error: true
        uses: ./.github/actions/capture-transcript
        with:
          enabled: ${{ contains(vars.AGENT_TRANSCRIPTS, 'all') || contains(vars.AGENT_TRANSCRIPTS, 'security') }}
          role: security
          execution_file: ${{ steps.security.outputs.execution_file }}
          role_arn: ${{ secrets.AWS_TRANSCRIPTS_ROLE }}
          bucket: ${{ secrets.AWS_TRANSCRIPTS_BUCKET }}
          entity: ${{ github.event.issue.number || github.event.pull_request.number }}

  # ── Custodial: the back half of the sandwich ─────────────────────────────────
  # Scripted checks on what the run left behind. The front half (delegate) routes and consults the
  # root role only where the script cannot decide; this mirrors it.
  #
  # ⚠️ NO MODEL STEP, deliberately. Nothing here needs judgement yet, and wiring a model that
  # decides nothing is a channel with no reader — the failure this repo keeps repeating. It joins
  # when a check genuinely cannot be scripted.
  #
  # ⚠️ `always()` IS LOAD-BEARING AND IS THE #430 TRAP. This needs five role jobs, four of which
  # skip on any given run, and a job needing a SKIPPED job reports cancelled without it. The same
  # shape already works for `security`, which carries `always()` because `delegate` skips on
  # `pull_request` — proven here, not theoretical.
  custodial:
    needs: [delegate, architect, researcher, authors, security, claude]
    if: always() && needs.delegate.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      # ⚠️ WRITE so this phase can CREATE a story branch — the only branch creation on the shaped
      # path. Safe here on the same argument as everything else in this job: it has no model step,
      # so nothing untrusted executes in it. Nothing here deletes.
      contents: write
      # write, to apply the classification label an issue is missing
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Stash the agent hooks
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cp packages/claude-team/hooks/*.py "$RUNNER_TEMP/agent-bin/"
          chmod +x "$RUNNER_TEMP/agent-bin"/*.py
      # ⚠️ FAILS THE RUN when an Architect left no Branch line. That stall reports success today —
      # measured on #834 and #866 — and `branch-navigation.py` already says the right thing about
      # it as a warning nobody reads. This is the same sentence with teeth.
      - name: Check the role left its deliverable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: deliverable
          ROLE: ${{ needs.delegate.outputs.roles }}
          KIND: ${{ needs.delegate.outputs.kind }}
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        run: "$RUNNER_TEMP/agent-bin/custodial-sweep.py"
      # ⚠️ THE TASKS ARE WHY THIS IS HERE. the trigger-time kind pass labels the TRIGGERING issue, so a
      # story gets one and the tasks the Architect just created never do — and tasks are the most
      # numerous kind. This runs after `file-sub-issues.py`, the first point at which those
      # children are discoverable at all. It only ever adds; an existing kind is left alone.
      - name: Make sure every issue says what it is
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: kind
          INCLUDE_SUB_ISSUES: "true"
          ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.number || '' }}
        run: "$RUNNER_TEMP/agent-bin/labels-and-status.py"

  # ── Merge housekeeping ─────────────────────────────────────────────────────────
  # Closes the issues a merged PR finished and files them on the board.
  #
  # ⚠️ NO MODEL. "Parse the closing keyword, close the issue, set one field" is fully
  # determined, and this is the only backlog behaviour that has worked from its first
  # run — everything model-driven took three attempts. It is also why PROJECTS_TOKEN
  # lives here and nowhere a prompt can reach it.
  merge_housekeeping:
    # ⚠️ EVERY merged PR, not just an agent's. This gated on a @claude/* label or a Bot
    # author, and skipped on #485 — the maintainer's own PR, unlabeled per convention —
    # so eight issues closed via GitHub's native keywords while the board was never
    # updated and the sub-issue expansion never ran. Nothing here needs the PR to be an
    # agent's: the board move, the non-default-base fallback and the sub-issue expansion
    # are all just as right for a hand-written PR, and it exits early on one that closes
    # no issue.
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ⚠️ WRITE, because `open-story-pr.py` calls `gh pr create`. It was `read`, so that call
      # 403'd every time — the hook has **never once** succeeded, and every story PR in this repo
      # was opened by hand. The docs described it as the mechanism regardless, which is how a
      # story branch sat unmerged long enough to lose its work (#735/#815).
      # ⚠️ Nothing else in this job needs it: `close-merged-work.py` only *reads* PRs and closes
      # issues, and the board writes go through PROJECTS_TOKEN on their own step.
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Stash the agent hooks
        run: |
          mkdir -p "$RUNNER_TEMP/agent-bin"
          cp packages/claude-team/hooks/*.py "$RUNNER_TEMP/agent-bin/"
          chmod +x "$RUNNER_TEMP/agent-bin"/*.py
      - name: Close and file the PR's issues
        env:
          # Two tokens on purpose. GITHUB_TOKEN reads the PR and closes issues;
          # PROJECTS_TOKEN is a classic PAT that exists only because it can reach
          # user-owned Projects v2, and needs `project` + `read:org` and nothing else.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PROJECT_OWNER: "@me"
          PROJECT_NUMBER: "4"
        run: "$RUNNER_TEMP/agent-bin/close-merged-work.py"
      # ⚠️ The story's PR opens HERE, not in an authoring run. Under sub-branching the story
      # branch is empty until a task PR merges into it, and GitHub will not open a PR with no
      # commits between base and head — so the first task merge is the earliest moment it can
      # exist. Runs for every merged PR and no-ops unless the base is a story branch.
      # ⚠️ Ordered AFTER close-merged-work.py: it reads task state, and the task this PR
      # just closed is only closed once that hook has run.
      - name: Update the story's task order
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # a task PR's base is its story's branch, named <story#>-<summary>
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          STORY=$(printf '%s' "$BASE" | grep -oE '^[0-9]+' || true)
          export STORY
          "$RUNNER_TEMP/agent-bin/log-to-story.py"
      - name: Open the story PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: "$RUNNER_TEMP/agent-bin/open-story-pr.py"

