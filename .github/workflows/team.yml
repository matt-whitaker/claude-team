        with:
          # ⚠️ THE HOST ACTION HAS ITS OWN ACTOR GUARD, INDEPENDENT OF OURS, and it rejected every
          # cascaded run: "Workflow initiated by non-human actor: brewdocs-claude (type: Bot)".
          # Our delegate guard admits this App on purpose — that is how a story cascades — but
          # admitting it there only gets the job started; the action then refuses at setup, before
          # the model is called. Measured on run 31929531465 (#1094).
          # ⚠️ NAMED, NEVER `*`. The action's own warning is that `*` lets any external App invoke
          # it with a prompt it controls. One private App with issues:write is the whole grant.
          allowed_bots: brewdocs-claude
