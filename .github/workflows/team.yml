          # issue trigger it always creates one — there is no way to decline in tag mode — and
          # then injects "You are already on the correct branch. Do not create a new branch",
          # which contradicts our prompt. Which instruction wins is down to the model, and it
          # has gone both ways: #497 pushed to the story branch, #514 pushed 44 turns of work
          # to `claude/issue-514-…` where nothing looks, reporting success.
          #
          # Empty prefix + this template makes that branch `<issue#>-<kebab-title>` — our own
          # shape. For a task that fully resolves it, since an author cuts any `<task#>-…`
          # branch it likes. It cannot match a story branch the Architect already named, so
          # finish-pr.py also reports commits stranded on an unexpected branch.
          # a task branch is cut off its STORY branch, not the default one — see the job
          # header. Empty when no story resolves, which falls back to the default branch.
          base_branch: ${{ needs.delegate.outputs.story_branch }}
          branch_prefix: ""
          branch_name_template: "{{entityNumber}}-{{description}}"
          track_progress: true
          prompt: ${{ steps.p_implementor.outputs.body }}
          # Allowlist by *family*, not per-subcommand. Deliberately NOT bare `Bash`: this
          # runner carries GH_TOKEN and the Claude OAuth token in env, and arbitrary shell
          # could exfiltrate them. Only write-access actors can trigger a run.
          # ⚠️ --json-schema makes the Implementor's final message the handoff contract, and
          # the action exposes it as `structured_output` for the two steps below. Prose
          # sections a later role has to find and parse are the shape that failed for
          # sub-issue filing: a consumer cannot tell "nothing to report" from "forgot".
          claude_args: |
            --model opus
            --allowedTools "Edit,Write,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*)"
            --max-turns 80
            --json-schema '${{ steps.schema.outputs.body }}'

      # ── Designer ──
      # The Implementor of the design system. Same shape — branch, PR, gate, handoff — with
      # the design package as its subject instead of the code that consumes it.
      #
      # ⚠️ The boundary is the PACKAGE, not a judgement call, so it can be checked rather
      # than negotiated. A task that changes a primitive *and* its call sites is two tasks,
      # and the Architect cuts it in two; the prompt tells the Designer to say so and stop
      # rather than reach across.
      #
      # ⚠️ Implementor and Designer are alternatives, not a sequence — a task is one or the
      # other. Both emit the same handoff schema, so whichever ran feeds the Tester and
      # Writer below.
      - name: Stamp the Designer label
        if: contains(steps.roles.outputs.list, 'designer')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE: designer
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: MODE=stamp "$RUNNER_TEMP/agent-bin/labels-and-status.py"
      - name: Designer
        id: designer
        if: contains(steps.roles.outputs.list, 'designer')
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORY: ${{ needs.delegate.outputs.story }}
          # the issue that actually triggered this run — the role's brief. Empty on a PR
          # trigger, where $STORY is the one to read.
