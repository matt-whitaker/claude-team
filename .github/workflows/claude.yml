# claude-team CONSUMING ITSELF. The stub, frozen, exactly as templates/consumer-stub.yml ships it
# — the only edits are the five inputs below and this note.
#
# ⚠️ THE `@ref` HERE PINS A RELEASE, like every other consumer, and is bumped the same way: a
# one-line PR after a tag exists. It is NOT one of the pins the release commit flips — those live
# on a commit that is tagged and DELIBERATELY NOT MERGED, and this file lives on mainline.
# `SelfInstall` in tests/test_workflow.py asserts it names a `vN`.
#
# ⚠️ A RUN HERE EXECUTES THE HOOKS AT THE PINNED TAG, NOT THE ONES IN THE CHECKOUT. Editing hooks/
# on a branch changes nothing about the run editing them, and merging changes nothing here until
# this pin is bumped — so a structural change is drilled in claude-team-example before a tag, not
# discovered by this repo after one.
# The whole consumer-side integration: this file, frozen, plus a .claude-team/ directory.
# Triggers, run-name and concurrency live HERE — a called workflow's own run-name is ignored
# and its workflow-level concurrency is unsupported.
name: Claude

run-name: >-
  Claude ·
  ${{ github.event_name == 'pull_request'
  && (github.event.pull_request.merged && 'Post-merge' || 'PR closed')
  || contains(github.event.comment.body || github.event.review.body, '@claude/architect') && 'Architect'
  || contains(github.event.comment.body || github.event.review.body, '@claude/implementor') && 'Implementor'
  || contains(github.event.comment.body || github.event.review.body, '@claude/tester') && 'Tester'
  || contains(github.event.comment.body || github.event.review.body, '@claude/writer') && 'Writer'
  || contains(github.event.comment.body || github.event.review.body, '@claude/designer') && 'Designer'
  || contains(github.event.comment.body || github.event.review.body, '@claude/security') && 'Security'
  || github.event_name == 'issues' && github.event.label.name != '@claude' && format('Label {0}', github.event.label.name)
  || github.event_name == 'issues' && endsWith(github.actor, '[bot]') && 'Cascade'
  || github.event_name == 'issues' && 'Run'
  || contains(github.event.comment.body || github.event.review.body, '@claude') && 'Root'
  || 'Comment' }}
  · #${{ github.event.issue.number || github.event.pull_request.number }}
  ${{ github.event.issue.title || github.event.pull_request.title }}

on:
  issues:
    # ⚠️ `closed` is NOT a second front door — no run is routed from it. It exists so a task
    # closed BY HAND can still open its story's PR: every other path to that hook is an
    # event the machinery produces, so a human close stranded the story permanently (#31).
    types: [labeled, closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  team:
    # ⚠️ THE CEILING, NOT THE GRANT. A called workflow's jobs cannot request permissions the caller
    # did not allow — omit this block and every run dies at startup with "the nested job X is
    # requesting … but is only allowed …". Each nested job still narrows to its own block; this is
    # the union of what any of them asks for.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    uses: matt-whitaker/claude-team/.github/workflows/team.yml@v4.3
    with:
      project_owner: matt-whitaker
      project_number: "9"
      allowed_bots: ""
      # The driver switch — session-driven by default; set CLAUDE_TEAM_DRIVER to `cascade` to opt in.
      driver: ${{ vars.CLAUDE_TEAM_DRIVER }}
      node: false
      browser: false
      # ⚠️ This repo is stdlib Python and its gate is `python3 -m unittest`. It is also
      # the case #46 was found on: with the old fixed npm/npx/node grant, no authoring
      # role here could run the gate at all.
      runtimes: "python3"
    secrets: inherit
